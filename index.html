<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微信文章转笔记</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/turndown/7.1.2/turndown.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #888888;
    --border: #e5e7eb;
    --brand: #07c160;
    --brand-dark: #06ad56;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  header { margin-bottom: 20px; }
  header h1 { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  header h1 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); display: inline-block; }
  header p { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .input-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .input-card input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 14px;
    outline: none;
  }
  .input-card input:focus { border-color: var(--brand); }
  .btn {
    border: none;
    border-radius: 8px;
    padding: 11px 20px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    background: var(--brand);
    color: #fff;
    transition: background .15s;
  }
  .btn:hover { background: var(--brand-dark); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.ghost { background: #fff; color: var(--text); border: 1px solid var(--border); }
  .btn.ghost:hover { background: #f2f3f5; }
  .btn.done, .btn.ghost.done { background: var(--brand) !important; color: #fff !important; border-color: var(--brand) !important; }

  .status { margin: 12px 4px; font-size: 13px; color: var(--muted); min-height: 20px; }
  .status.err { color: #e24b4a; }

  .note {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: none;
  }
  .note.show { display: block; }

  .note-meta { padding: 18px 20px 12px; border-bottom: 1px solid var(--border); }
  .note-meta h2 { font-size: 18px; font-weight: 600; line-height: 1.4; }
  .note-meta .sub { margin-top: 6px; font-size: 13px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }

  .toolbar {
    display: flex;
    gap: 4px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    background: #fafbfc;
    flex-wrap: wrap;
    align-items: center;
  }
  .toolbar button {
    border: 1px solid transparent;
    background: transparent;
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 13px;
    color: #444;
    transition: background .12s, color .12s;
  }
  .toolbar button:hover { background: #eef0f2; }
  .toolbar button.active { background: var(--brand); color: #fff; }
  .toolbar button.active:hover { background: var(--brand); }
  .toolbar .sep { width: 1px; height: 18px; background: var(--border); margin: 0 6px; }

  .editor {
    padding: 20px 22px;
    min-height: 320px;
    outline: none;
    font-size: 15px;
    line-height: 1.8;
  }
  .editor img { max-width: 100%; height: auto; border-radius: 6px; display: block; margin: 12px 0; }
  .editor p { margin: 0 0 14px; }
  .editor blockquote {
    border-left: 3px solid var(--brand);
    padding-left: 12px;
    color: #666;
    margin: 14px 0;
  }
  .editor h1, .editor h2, .editor h3 { margin: 18px 0 10px; }

  .note-actions { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

  .hint { font-size: 12px; color: #aaa; margin: 8px 4px 0; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 36px;
    transform: translateX(-50%) translateY(16px);
    background: var(--brand);
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 999;
    max-width: 82%;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { background: #e24b4a; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="dot"></span>微信文章转笔记</h1>
    <p>粘贴公众号文章链接，一键抓取正文 + 图片，转成可编辑笔记。</p>
  </header>

  <div class="input-card">
    <input id="urlInput" type="text" placeholder="粘贴文章链接，如 https://mp.weixin.qq.com/s/..." />
    <button class="btn" id="fetchBtn" onclick="doFetch()">抓取</button>
  </div>
  <div class="hint">提示：在微信里打开文章 → 右上角「···」→ 复制链接。</div>

  <div class="status" id="status"></div>

  <div class="note" id="note">
    <div class="note-meta">
      <h2 id="noteTitle"></h2>
      <div class="sub">
        <span id="noteAuthor"></span>
        <span id="noteImgCount"></span>
        <span id="noteSource"></span>
      </div>
    </div>
    <div class="toolbar" id="toolbar">
      <button data-cmd="bold" onclick="cmd('bold')" title="加粗"><b>B</b></button>
      <button data-cmd="italic" onclick="cmd('italic')" title="斜体"><i>I</i></button>
      <button data-cmd="underline" onclick="cmd('underline')" title="下划线"><u>U</u></button>
      <span class="sep"></span>
      <button data-fmt="h2" onclick="fmt('h2')" title="二级标题">H2</button>
      <button data-fmt="h3" onclick="fmt('h3')" title="三级标题">H3</button>
      <button data-fmt="blockquote" onclick="fmt('blockquote')" title="引用">引用</button>
      <span class="sep"></span>
      <button onclick="cmd('removeFormat')" title="清除格式">清除格式</button>
    </div>
    <div class="editor" id="editor" contenteditable="true" spellcheck="false"></div>
    <div class="note-actions">
      <button class="btn ghost" onclick="copyRichText()">复制（带图）</button>
      <button class="btn ghost" onclick="copyMarkdown()">复制 Markdown</button>
      <button class="btn ghost" onclick="exportHtml()">导出 HTML</button>
      <button class="btn ghost" onclick="exportMd()">导出 Markdown</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const statusEl = $('status');
const toastEl = $('toast');
let toastTimer = null;

function setStatus(msg, isErr) {
  statusEl.textContent = msg || '';
  statusEl.className = 'status' + (isErr ? ' err' : '');
}

function showToast(msg, isErr) {
  toastEl.textContent = msg;
  toastEl.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.className = 'toast'; }, 2600);
}

function blobToDataUri(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

// 把容器里的本地 /static 图片转 base64 内嵌，返回原容器（就地修改）
async function inlineImages(container) {
  const imgs = container.querySelectorAll('img');
  await Promise.all([...imgs].map(async (img) => {
    const src = img.getAttribute('src') || '';
    if (src.startsWith('/static/')) {
      try {
        const r = await fetch(src);
        img.setAttribute('src', await blobToDataUri(await r.blob()));
      } catch (e) { /* 转码失败保留原路径 */ }
    }
  }));
  return container;
}

async function doFetch() {
  const url = $('urlInput').value.trim();
  if (!url) { showToast('请先粘贴文章链接', true); return; }
  const btn = $('fetchBtn');
  btn.disabled = true;
  setStatus('正在抓取文章和图片，请稍候…');
  try {
    const r = await fetch('/api/fetch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });
    const data = await r.json();
    if (!r.ok) { setStatus(data.detail || '抓取失败', true); showToast(data.detail || '抓取失败', true); return; }
    render(data);
    setStatus(`完成：正文已抓取，图片 ${data.image_count} 张已本地化，可直接编辑。`);
    showToast('抓取完成，图片已本地化');
  } catch (e) {
    setStatus('请求失败：' + e.message, true);
    showToast('请求失败：' + e.message, true);
  } finally {
    btn.disabled = false;
  }
}

function render(data) {
  $('noteTitle').textContent = data.title;
  $('noteAuthor').textContent = data.author ? '作者：' + data.author : '';
  $('noteImgCount').textContent = '图片：' + data.image_count + ' 张';
  $('noteSource').textContent = '原文链接';
  $('noteSource').style.cursor = 'pointer';
  $('noteSource').onclick = () => window.open(data.source_url, '_blank');
  $('editor').innerHTML = data.content_html;
  $('note').classList.add('show');
  $('note').scrollIntoView({ behavior: 'smooth' });
}

function cmd(name) {
  document.execCommand(name, false, null);
  $('editor').focus();
  syncToolbar();
}

function fmt(tag) {
  document.execCommand('formatBlock', false, '<' + tag + '>');
  $('editor').focus();
  syncToolbar();
}

// 同步工具栏按钮高亮（依据当前选区/光标处的格式状态）
function syncToolbar() {
  ['bold', 'italic', 'underline'].forEach(c => {
    const btn = document.querySelector('.toolbar button[data-cmd="' + c + '"]');
    if (!btn) return;
    let on = false;
    try { on = document.queryCommandState(c); } catch (e) {}
    btn.classList.toggle('active', !!on);
  });
  let val = '';
  try { val = document.queryCommandValue('formatBlock'); } catch (e) {}
  if (val) val = val.toLowerCase();
  ['h2', 'h3', 'blockquote'].forEach(t => {
    const btn = document.querySelector('.toolbar button[data-fmt="' + t + '"]');
    if (btn) btn.classList.toggle('active', val === t);
  });
}
document.addEventListener('selectionchange', syncToolbar);

function download(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

const EXPORT_STYLE = '<style>body{max-width:720px;margin:24px auto;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8;color:#1a1a1a;padding:0 16px;font-size:15px}img{max-width:100%;height:auto;border-radius:6px;display:block;margin:12px 0}p{margin:0 0 14px}blockquote{border-left:3px solid #07c160;padding-left:12px;color:#666;margin:14px 0}h1,h2,h3{margin:18px 0 10px}</style>';

async function exportHtml() {
  const editor = $('editor');
  if (!editor.innerHTML.trim()) { showToast('先抓取一篇文章', true); return; }
  const clone = await inlineImages(editor.cloneNode(true));
  const html = '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>'
    + $('noteTitle').textContent + '</title>' + EXPORT_STYLE + '</head><body>'
    + clone.innerHTML + '</body></html>';
  download($('noteTitle').textContent + '.html', html, 'text/html');
  showToast('已导出 HTML：图文已内嵌，双击即可查看');
}

async function exportMd() {
  const editor = $('editor');
  if (!editor.innerHTML.trim()) { showToast('先抓取一篇文章', true); return; }
  const clone = await inlineImages(editor.cloneNode(true));
  const td = new TurndownService({ headingStyle: 'atx', codeBlockStyle: 'fenced' });
  const title = $('noteTitle').textContent;
  const author = $('noteAuthor').textContent.replace('作者：', '');
  const md = '# ' + title + '\n\n'
    + (author ? '> 作者：' + author + '\n\n' : '')
    + td.turndown(clone.innerHTML);
  download(title + '.md', md, 'text/markdown');
  showToast('已导出 Markdown：图片以 base64 内嵌');
}

async function copyRichText() {
  const editor = $('editor');
  if (!editor.innerHTML.trim()) { showToast('先抓取一篇文章', true); return; }
  const clone = await inlineImages(editor.cloneNode(true));
  const html = clone.innerHTML;
  const plain = editor.innerText;
  try {
    await navigator.clipboard.write([
      new ClipboardItem({
        'text/html': new Blob([html], { type: 'text/html' }),
        'text/plain': new Blob([plain], { type: 'text/plain' })
      })
    ]);
    const n = clone.querySelectorAll('img').length;
    showToast('已复制：正文 + ' + n + ' 张图，可粘贴到公众号编辑器 / Word / 印象笔记等');
  } catch (e) {
    showToast('复制失败：' + e.message + '（需 localhost/HTTPS 且点击触发）', true);
  }
}

async function copyMarkdown() {
  const editor = $('editor');
  if (!editor.innerHTML.trim()) { showToast('先抓取一篇文章', true); return; }
  const clone = await inlineImages(editor.cloneNode(true));
  const td = new TurndownService({ headingStyle: 'atx', codeBlockStyle: 'fenced' });
  const title = $('noteTitle').textContent;
  const author = $('noteAuthor').textContent.replace('作者：', '');
  const md = '# ' + title + '\n\n'
    + (author ? '> 作者：' + author + '\n\n' : '')
    + td.turndown(clone.innerHTML);
  try {
    await navigator.clipboard.writeText(md);
    showToast('已复制 Markdown：图片 base64 内嵌');
  } catch (e) {
    showToast('复制失败：' + e.message, true);
  }
}

$('urlInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') doFetch(); });
</script>
</body>
</html>
